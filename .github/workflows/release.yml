name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  linux:
    name: Linux packages
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            desktop-file-utils \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - name: Set up locked dependencies
        run: ./setup.sh --skip-system-deps --with-e2e --no-check

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Verify tag matches project version
        run: ./scripts/verify-version.sh "${GITHUB_REF_NAME}"

      - name: Validate
        run: ./scripts/check.sh --with-e2e

      - name: Build Linux bundles
        run: npm run tauri build

      - name: Collect release artifacts
        run: |
          mkdir -p release-artifacts
          deb="$(find src-tauri/target/release/bundle -type f -name '*.deb' -print -quit)"
          appimage="$(find src-tauri/target/release/bundle -type f -name '*.AppImage' -print -quit)"
          test -n "$deb"
          test -n "$appimage"
          cp "$deb" release-artifacts/Speedysearch-Linux-amd64.deb
          cp "$appimage" release-artifacts/Speedysearch-Linux-x86_64.AppImage

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: speedysearch-${{ github.ref_name }}-linux
          path: release-artifacts/*
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Rust tooling
        run: rustup component add clippy rustfmt

      - name: Install locked dependencies
        run: npm ci

      - name: Test native Windows backend
        shell: powershell
        run: |
          .\windows-native\test.ps1 -Configuration Release

      - name: Lint Windows Tauri shell
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Test Windows Tauri shell
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib --bins --tests

      - name: Test shared frontend
        run: npm run test:unit

      - name: Build Windows installer
        run: npm run tauri build

      - name: Collect release artifact
        shell: powershell
        run: |
          $installers = @(
            Get-ChildItem -Path "src-tauri\target\release\bundle\nsis" `
              -Filter "*-setup.exe" -File
          )
          if ($installers.Count -ne 1) {
            throw "Expected one NSIS installer, found $($installers.Count)."
          }
          New-Item -ItemType Directory -Path release-artifacts -Force | Out-Null
          Copy-Item -LiteralPath $installers[0].FullName `
            -Destination "release-artifacts\Speedysearch-Windows-x64-Setup.exe"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: speedysearch-${{ github.ref_name }}-windows
          path: release-artifacts/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - linux
      - windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: speedysearch-${{ github.ref_name }}-*
          path: release-artifacts
          merge-multiple: true

      - name: Create checksums
        working-directory: release-artifacts
        run: sha256sum Speedysearch-* > SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" release-artifacts/*
          --generate-notes
          --title "Speedysearch ${GITHUB_REF_NAME}"
          --verify-tag
