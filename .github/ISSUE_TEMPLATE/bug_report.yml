name: Bug report
description: Report a reproducible Speedysearch problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Speedysearch. Remove private paths, queries,
        clickstream content, and other personal data before submitting.
  - type: input
    id: version
    attributes:
      label: Speedysearch version
      description: Release number or commit SHA
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Linux distribution, version, display server, and desktop
      placeholder: Pop!_OS 24.04, Wayland, COSMIC
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that triggers the bug.
      placeholder: |
        1. Start Speedysearch with ...
        2. Search for ...
        3. Press ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: Paste sanitized logs or screenshots if useful.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed personal and security-sensitive data.
          required: true
        - label: This is not a security vulnerability.
          required: true
