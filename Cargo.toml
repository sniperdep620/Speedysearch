[package]
name = "speedysearch"
version = "0.2.0"
edition = "2021"
description = "Fast, private local search for Linux desktops"
license = "Apache-2.0"
readme = "README.md"
authors = ["Speedysearch contributors"]
keywords = ["search", "launcher", "desktop", "linux"]
categories = ["filesystem", "gui"]
publish = false

[dependencies]
anyhow = "1"
bincode = "1"
chrono = "0.4"
eframe = { version = "0.35", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
fasthash = "0.4"
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "io-util"] }
toml = "0.8"
walkdir = "2"

[dev-dependencies]
criterion = "0.5"
tempfile = "3"

[[bench]]
name = "benchmarks"
harness = false
